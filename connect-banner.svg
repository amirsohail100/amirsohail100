<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="Let's build something together" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .head{font:800 30px 'Segoe UI',Arial,sans-serif;fill:url(#tg)}
  .sub{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#8b949e;opacity:0;animation:cycle 12s infinite}
  .s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}
  .shine{stroke:url(#tg);stroke-width:3;stroke-linecap:round;fill:none;stroke-dasharray:140 400;animation:run 3.5s linear infinite}
  .orb{animation:float 5s ease-in-out infinite}
  .o2{animation-delay:1.2s}.o3{animation-delay:2.4s}
  @keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%,22%{opacity:1;transform:none}28%,100%{opacity:0;transform:translateY(-8px)}}
  @keyframes run{from{stroke-dashoffset:540}to{stroke-dashoffset:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a2b"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="798" height="148" rx="14" fill="url(#bg)" stroke="#30363d"/>
<rect x="1" y="1" width="798" height="148" rx="14" class="shine" pathLength="540"/>
<circle class="orb" cx="70" cy="48" r="5" fill="#22d3ee" opacity=".7"/>
<circle class="orb o2" cx="738" cy="104" r="6" fill="#a371f7" opacity=".7"/>
<circle class="orb o3" cx="716" cy="38" r="3.5" fill="#58a6ff" opacity=".8"/>
<text class="head" x="400" y="68" text-anchor="middle">Let's build something together</text>
<text class="sub" x="400" y="108" text-anchor="middle">Open-source Generative AI</text>
<text class="sub s2" x="400" y="108" text-anchor="middle">LangChain &amp; LangGraph agentic projects</text>
<text class="sub s3" x="400" y="108" text-anchor="middle">MLOps, CI/CD &amp; cloud deployment</text>
<text class="sub s4" x="400" y="108" text-anchor="middle">Explainable ML &amp; real-world products</text>
</svg>
