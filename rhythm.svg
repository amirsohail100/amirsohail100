<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 318" width="800" height="318" role="img" aria-label="Coding rhythm">
<style>
  .bg{fill:#0d1117;stroke:#30363d}
  .tile{fill:#11161d;stroke:#21262d}
  .t{fill:#e6edf3;font:800 20px 'Segoe UI',Arial,sans-serif}
  .s{fill:#8b949e;font:600 12px 'Segoe UI',Arial,sans-serif}
  .tv{fill:#22d3ee;font:800 20px 'Segoe UI',Arial,sans-serif}
  .tl{fill:#8b949e;font:600 10.5px 'Segoe UI',Arial,sans-serif}
  .sec{fill:#e6edf3;font:700 13px 'Segoe UI',Arial,sans-serif}
  .bl{fill:#8b949e;font:600 10px 'Segoe UI',Arial,sans-serif}
  .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
  .hi{fill:#22d3ee} .lo{fill:#1d6f80}
  .rise{opacity:0;animation:rise .6s ease-out forwards}
  @keyframes up{to{transform:scaleY(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect class="bg" x=".5" y=".5" width="799" height="317" rx="14"/>
<text class="t" x="24" y="38">Coding Rhythm</text>
<text class="s" x="24" y="56">Activity patterns over the last 12 months (relative, not totals)</text>
<g class="rise" style="animation-delay:0.00s"><rect x="24" y="70" width="242" height="56" rx="8" class="tile"/><text x="145.0" y="96" class="tv" text-anchor="middle">Wednesday</text><text x="145.0" y="115" class="tl" text-anchor="middle">Most Active Day</text></g><g class="rise" style="animation-delay:0.15s"><rect x="279" y="70" width="242" height="56" rx="8" class="tile"/><text x="400.0" y="96" class="tv" text-anchor="middle">August</text><text x="400.0" y="115" class="tl" text-anchor="middle">Most Active Month</text></g><g class="rise" style="animation-delay:0.30s"><rect x="534" y="70" width="242" height="56" rx="8" class="tile"/><text x="655.0" y="96" class="tv" text-anchor="middle">73%</text><text x="655.0" y="115" class="tl" text-anchor="middle">Days With Activity</text></g>
<g class="rise" style="animation-delay:.7s"><rect x="24" y="142" width="370" height="162" rx="10" class="tile"/>
<text x="40" y="164" class="sec">By weekday</text></g>
<g class="rise" style="animation-delay:.8s"><rect x="406" y="142" width="370" height="162" rx="10" class="tile"/>
<text x="422" y="164" class="sec">By month</text></g>
<rect x="44.0" y="181.4" width="40.3" height="100.6" rx="3" class="bar lo" style="animation-delay:1.00s"><title>Sun</title></rect><text x="64.1" y="298" class="bl" text-anchor="middle">Sun</text><rect x="92.3" y="179.8" width="40.3" height="102.2" rx="3" class="bar lo" style="animation-delay:1.07s"><title>Mon</title></rect><text x="112.4" y="298" class="bl" text-anchor="middle">Mon</text><rect x="140.6" y="179.7" width="40.3" height="102.3" rx="3" class="bar lo" style="animation-delay:1.14s"><title>Tue</title></rect><text x="160.7" y="298" class="bl" text-anchor="middle">Tue</text><rect x="188.9" y="178.0" width="40.3" height="104.0" rx="3" class="bar hi" style="animation-delay:1.21s"><title>Wed</title></rect><text x="209.0" y="298" class="bl" text-anchor="middle">Wed</text><rect x="237.1" y="185.3" width="40.3" height="96.7" rx="3" class="bar lo" style="animation-delay:1.28s"><title>Thu</title></rect><text x="257.3" y="298" class="bl" text-anchor="middle">Thu</text><rect x="285.4" y="184.9" width="40.3" height="97.1" rx="3" class="bar lo" style="animation-delay:1.35s"><title>Fri</title></rect><text x="305.6" y="298" class="bl" text-anchor="middle">Fri</text><rect x="333.7" y="179.7" width="40.3" height="102.3" rx="3" class="bar lo" style="animation-delay:1.42s"><title>Sat</title></rect><text x="353.9" y="298" class="bl" text-anchor="middle">Sat</text>
<rect x="438.0" y="279.0" width="19.2" height="3.0" rx="3" class="bar lo" style="animation-delay:1.20s"><title>N</title></rect><text x="447.6" y="298" class="bl" text-anchor="middle">N</text><rect x="465.2" y="279.0" width="19.2" height="3.0" rx="3" class="bar lo" style="animation-delay:1.27s"><title>D</title></rect><text x="474.8" y="298" class="bl" text-anchor="middle">D</text><rect x="492.3" y="223.0" width="19.2" height="59.0" rx="3" class="bar lo" style="animation-delay:1.34s"><title>J</title></rect><text x="501.9" y="298" class="bl" text-anchor="middle">J</text><rect x="519.5" y="238.5" width="19.2" height="43.5" rx="3" class="bar lo" style="animation-delay:1.41s"><title>F</title></rect><text x="529.1" y="298" class="bl" text-anchor="middle">F</text><rect x="546.7" y="218.2" width="19.2" height="63.8" rx="3" class="bar lo" style="animation-delay:1.48s"><title>M</title></rect><text x="556.2" y="298" class="bl" text-anchor="middle">M</text><rect x="573.8" y="208.7" width="19.2" height="73.3" rx="3" class="bar lo" style="animation-delay:1.55s"><title>A</title></rect><text x="583.4" y="298" class="bl" text-anchor="middle">A</text><rect x="601.0" y="217.7" width="19.2" height="64.3" rx="3" class="bar lo" style="animation-delay:1.62s"><title>M</title></rect><text x="610.6" y="298" class="bl" text-anchor="middle">M</text><rect x="628.2" y="203.9" width="19.2" height="78.1" rx="3" class="bar lo" style="animation-delay:1.69s"><title>J</title></rect><text x="637.8" y="298" class="bl" text-anchor="middle">J</text><rect x="655.3" y="179.6" width="19.2" height="102.4" rx="3" class="bar lo" style="animation-delay:1.76s"><title>J</title></rect><text x="664.9" y="298" class="bl" text-anchor="middle">J</text><rect x="682.5" y="178.0" width="19.2" height="104.0" rx="3" class="bar hi" style="animation-delay:1.83s"><title>A</title></rect><text x="692.1" y="298" class="bl" text-anchor="middle">A</text><rect x="709.7" y="193.3" width="19.2" height="88.7" rx="3" class="bar lo" style="animation-delay:1.90s"><title>S</title></rect><text x="719.3" y="298" class="bl" text-anchor="middle">S</text><rect x="736.8" y="207.8" width="19.2" height="74.2" rx="3" class="bar lo" style="animation-delay:1.97s"><title>O</title></rect><text x="746.4" y="298" class="bl" text-anchor="middle">O</text>
</svg>